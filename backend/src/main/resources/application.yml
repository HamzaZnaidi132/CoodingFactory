spring:
  application:
    name: codingfactory-api
  datasource:
    url: jdbc:h2:mem:codingfactory;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  # 8080 = Oracle TNS (fréquent). Port dédié CodingFactory en local : 8090
  port: ${SERVER_PORT:8090}

codingfactory:
  cors:
    allowed-origins: ${CODINGFACTORY_CORS_ALLOWED_ORIGINS:http://localhost:4200}
  ollama:
    enabled: ${OLLAMA_ENABLED:true}
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:llama3.2}
    timeout-seconds: 120

management:
  endpoints:
    web:
      exposure:
        include: health,info
