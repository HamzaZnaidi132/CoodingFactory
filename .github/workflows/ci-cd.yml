name: CI/CD CodingFactory

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Microservices (Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Package all modules
        run: mvn -B -DskipTests package
      - name: Run tests
        run: mvn -B test

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests (headless)
        run: npm run test:ci
      - name: Build production bundle
        run: npm run build

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Eureka image
        uses: docker/build-push-action@v6
        with:
          context: ./eureka-server
          push: false
          tags: codingfactory-eureka:latest
      - name: Build chatbot image
        uses: docker/build-push-action@v6
        with:
          context: ./chatbot-service
          push: false
          tags: codingfactory-chatbot:latest
      - name: Build PFE image
        uses: docker/build-push-action@v6
        with:
          context: ./pfe-service
          push: false
          tags: codingfactory-pfe:latest
      - name: Build gateway image
        uses: docker/build-push-action@v6
        with:
          context: ./api-gateway
          push: false
          tags: codingfactory-gateway:latest
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: codingfactory-frontend:latest

  deploy:
    name: CD placeholder
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Deployment hook
        run: |
          echo "Branch main validée : brancher ici kubectl, SSH, ou registry push selon votre infra."
