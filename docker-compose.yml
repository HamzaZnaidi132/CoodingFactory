services:
  backend:
    build:
      context: ./backend
    container_name: codingfactory-backend
    ports:
      - "8090:8080"
    environment:
      SERVER_PORT: "8080"
      CODINGFACTORY_CORS_ALLOWED_ORIGINS: http://localhost:4200,http://localhost
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    container_name: codingfactory-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
