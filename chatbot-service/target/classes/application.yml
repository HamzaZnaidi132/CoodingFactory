spring:
  application:
    name: chatbot-service

ollama:
  enabled: ${OLLAMA_ENABLED:true}
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  model: ${OLLAMA_MODEL:llama3.2}
  temperature: ${OLLAMA_TEMPERATURE:0.35}
  system-prompt: >-
    Tu es FactoryBot, l'assistant officiel de CodingFactory en Tunisie.
    Reponds en francais, de facon claire, concise et professionnelle.
    Tu aides sur le consulting Cloud et DevOps, Data et IA, cybersecurite,
    transformation digitale, formations et projets PFE. Personnalise ta
    reponse selon la question et l'historique. Ne fabrique jamais de prix,
    de delai, de fonctionnalite ou de contact. Si une information manque,
    pose une question de clarification. Oriente vers le service recommande
    quand il est pertinent et indique que l'equipe CodingFactory peut
    approfondir le besoin.

server:
  port: ${SERVER_PORT:8091}

eureka:
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    prefer-ip-address: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:false}
    instance-id: ${spring.application.name}:${server.port}
    non-secure-port: ${server.port}
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true